name: Muthamilselvan - Portfolio CI

on:
  push:
    branches:
        - main

  pull_request:
    branches:
        - main

  workflow_dispatch:

permissions:
    contents: read

concurrency:
  group: flutter-ci-${{github.workflow}}-${{github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:

    format:
      name: Check formatting
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Setup Flutter
          uses: subosito/flutter-action@v2
          with:
            flutter-version: '3.47.5'
            channel: stable
            cache: true

        - name: Install dependencies
          run: flutter pub get

        - name: Check code formatting
          run: dart format --output=none --set-exit-if-changed lib test

    analyze-and-test:
        name: Test and Analyze Dart and Flutter code
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.47.5'
                channel: stable
                cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Analyze project
              run: flutter analyze

            - name: Run test
              run: flutter test

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs:
          - format
          - analyze-and-test

        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.47.5'
                channel: stable
                cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Build release web
              run: flutter build web --release --pwa-strategy=none

            - name: Upload web artifact
              uses: actions/upload-artifact@v4
              with:
                name: flutter-release-web
                path: build/web
                retention-days: 7
    deploy:
        name: Deploy to Firebase Hosting

        permissions:
          contents: read
          actions: write

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        needs:
          - build

        environment: production

        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
          - name: Checkout source code
            uses: actions/checkout@v4

          - name: Download web artifact
            uses: actions/download-artifact@v4
            with:
              name: flutter-release-web
              path: build/web

          - name: Deploy to Firebase Hosting
            uses: FirebaseExtended/action-hosting-deploy@v0
            with:
              firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUTHAMILSELVAN_PORTFOLIO }}
              projectId: muthamilselvan-portfolio
              channelId: live

          - name: Delete deployed artifact
            if: success()
            uses: actions/github-script@v7
            with:
              script: |
               const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
               });
               const artifact = result.data.artifacts.find(
               artifact => artifact.name === 'flutter-release-web'
               );
               if (artifact) {
               await github.rest.actions.deleteArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: artifact.id,
               });
               }