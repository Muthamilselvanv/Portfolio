name: Muthamilselvan - Portfolio CI

on:
  push:
    branches:
        - main
        - portfolio-CI/CD
        
  pull_request:
    branches:
        - main
        - portfolio-CI/CD

jobs:
    test:
        name: Test and Analyze Dart and Flutter code
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2

            - name: Install dependencies
              run: flutter pub get
              
            - name: Analyze project
              run: flutter analyze

            - name: Run test
              run: flutter test
